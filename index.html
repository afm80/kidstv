.cat .ico{display:inline-block;width:16px;height:16px;color:#fff;line-height:1;flex-shrink:0;}
.cat.active .ico{color:#000}
.cat .ico svg{width:100%;height:100%;display:block;fill:currentColor}
@media (max-width: 600px){.cats-bar{padding:5px 8px 8px;}.cats{gap:5px;}.cat{font-size:12px;padding:7px 12px;gap:4px;}.cat .ico{width:14px;height:14px;}}

function getYouTubeId(url){
  if(!url)return null;
  try{
    url=url.trim();
    const parsed=new URL(url);
    const host=parsed.hostname.toLowerCase().replace(/^www\./,'');
    let id=null;
    const isYT=host==='youtube.com'||host==='m.youtube.com'||host.endsWith('.youtube.com')||host==='youtube-nocookie.com'||host.endsWith('.youtube-nocookie.com');
    if(host==='youtu.be'){id=parsed.pathname.split('/').filter(Boolean)[0];}
    else if(isYT){
      id=parsed.searchParams.get('v');
      if(!id){const m=parsed.pathname.match(/^\/(?:embed|live|shorts|v)\/([^\/?#]+)/);id=m?m[1]:null;}
    }
    if(!id)return null;
    id=id.split(/[?&#]/)[0];
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:null;
  }catch(e){return null;}
}

const TITLE_CACHE_KEY='yt_titles_v1';
function loadTitleCache(){try{const s=localStorage.getItem(TITLE_CACHE_KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function saveTitleCache(cache){try{localStorage.setItem(TITLE_CACHE_KEY,JSON.stringify(cache));}catch(e){}}
const titleCache=loadTitleCache();

function fetchYouTubeTitle(videoId){
  return new Promise((resolve)=>{
    if(titleCache[videoId]!==undefined){resolve(titleCache[videoId]);return;}
    const api='https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+videoId+'&format=json';
    fetch(api).then(r=>r.ok?r.json():null).then(data=>{
      let t=(data&&data.title)?data.title:null;
      titleCache[videoId]=t;
      saveTitleCache(titleCache);
      resolve(t);
    }).catch(()=>resolve(null));
  });
}

function parseUrls(data){
  const lines=data.trim().split('\n').map(l=>l.trim()).filter(l=>l!=='');
  const list=[];
  for(const url of lines){
    const id=getYouTubeId(url);
    if(id)list.push({id,title:titleCache[id]||''});
  }
  return list;
}

const categories={live:parseUrls(liveData),videos:parseUrls(videosData)};
const allYouTubeVideos=[...categories.live.map(v=>({...v,cat:'live'})),...categories.videos.map(v=>({...v,cat:'videos'}))];

let activeCat=localStorage.getItem('activeCat')||'all';
let currentVideos=[];
let savedVideoIndex=parseInt(localStorage.getItem('activeVideoIndex')||'-1',10);

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getVideosForCat(cat){if(cat==='all')return shuffle([...categories.live,...categories.videos]);return categories[cat]?categories[cat].slice():[];}

function renderGrid(){
  grid.innerHTML='';
  currentVideos.forEach((v,index)=>{
    const card=document.createElement('button');
    card.className='card';
    card.innerHTML=`<div class="thumb-wrap"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""><span class="duration">--:--</span></div><div class="card-title">${v.title||''}</div>`;
    card.onclick=()=>openPlayer(currentVideos,index,true);
    grid.appendChild(card);
    if(!v.title){fetchYouTubeTitle(v.id).then(t=>{if(t){v.title=t;card.querySelector('.card-title').textContent=t;}});}
  });
}

function hideAllPages(){
  normalPage.style.display='none';
  satPage.classList.remove('active');
  satPage.style.display='none';
  kidsGamesPage.style.display='none';
  ourLivePage.style.display='none';
  searchPage.style.display='none';
}

function setCategory(cat){
  activeCat=cat;
  localStorage.setItem('activeCat',cat);
  [...catsBar.querySelectorAll('.cat')].forEach(btn=>{btn.classList.toggle('active',btn.dataset.cat===cat);});
  hideAllPages();
  if(cat==='sat'){satPage.classList.add('active');satPage.style.display='block';window.scrollTo({top:0,behavior:'auto'});return;}
  if(cat==='kidsgames'){kidsGamesPage.style.display='block';if(kidsGamesFrame.src==='about:blank'){kidsGamesFrame.src='https://www.crazygames.com';}window.scrollTo({top:0,behavior:'auto'});return;}
  if(cat==='ourlive'){ourLivePage.style.display='block';if(ourLiveFrame.src==='about:blank'){ourLiveFrame.src='https://afm80.github.io/kidstvlive/';}window.scrollTo({top:0,behavior:'auto'});return;}
  if(cat==='search'){searchPage.style.display='block';searchInput.value='';searchGrid.innerHTML='';searchEmpty.style.display='block';searchEmpty.textContent='اكتب كلمة للبحث...';window.scrollTo({top:0,behavior:'auto'});setTimeout(()=>searchInput.focus(),100);return;}
  normalPage.style.display='block';
  currentVideos=getVideosForCat(cat);
  renderGrid();

}

catsBar.querySelectorAll('.cat').forEach(btn=>{btn.onclick=()=>setCategory(btn.dataset.cat);});
searchBtn.onclick=()=>setCategory('search');

searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  searchGrid.innerHTML='';
  if(!q){searchEmpty.style.display='block';searchEmpty.textContent='اكتب كلمة للبحث...';return;}
  const results=allYouTubeVideos.filter(v=>(v.title||'').toLowerCase().includes(q));
  if(results.length===0){searchEmpty.style.display='block';searchEmpty.textContent='لا توجد نتائج مطابقة.';return;}
  searchEmpty.style.display='none';
  results.forEach((v,index)=>{
    const card=document.createElement('button');
    card.className='card';
    card.innerHTML=`<div class="thumb-wrap"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""><span class="duration">--:--</span></div><div class="card-title">${v.title||''}</div>`;
    card.onclick=()=>{const catVideos=getVideosForCat(v.cat);const realIndex=catVideos.findIndex(cv=>cv.id===v.id);openPlayer(catVideos,realIndex>=0?realIndex:index,true);};
    searchGrid.appendChild(card);
  });
});

let playerOpen=false;
function stopPlayback(){youtubeFrame.onload=null;youtubeFrame.src='about:blank';ytPoster.removeAttribute('src');ytPoster.style.display='none';}

function openPlayer(videosList,index,fromClick){
  const v=videosList[index];
  if(!v)return;
  ytPoster.src=`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
  ytPoster.style.display='block';
  youtubeFrame.src=`https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`;
  youtubeFrame.onload=()=>{ytPoster.style.display='none';};
  relatedScroll.innerHTML='';
  videosList.forEach((rv,ri)=>{
    if(ri===index)return;
    const rc=document.createElement('button');
    rc.className='related-card';
    rc.innerHTML=`<div class="related-thumb"><img src="https://i.ytimg.com/vi/${rv.id}/hqdefault.jpg" alt=""></div><div class="related-title">${rv.title||''}</div>`;
    rc.onclick=()=>openPlayer(videosList,ri,true);
    relatedScroll.appendChild(rc);
    if(!rv.title){fetchYouTubeTitle(rv.id).then(t=>{if(t){rv.title=t;rc.querySelector('.related-title').textContent=t;}});}
  });
  playerPage.style.display='block';
  playerPage.scrollTop=0;
  playerOpen=true;
  if(fromClick){localStorage.setItem('activeVideoId',v.id);}
  setTimeout(()=>{
    let targetIndex=0,count=0;
    for(let i=0;i<videosList.length;i++){if(i===index){targetIndex=count;break;}count++;}
    const target=relatedScroll.children[targetIndex];
    if(target){const offset=target.offsetLeft-relatedScroll.offsetLeft-12;relatedScroll.scrollTo({left:offset,behavior:'auto'});}
  },50);
}

let isDown=false,startX,scrollLeft;
relatedScroll.addEventListener('mousedown',e=>{isDown=true;relatedScroll.classList.add('dragging');startX=e.pageX-relatedScroll.offsetLeft;scrollLeft=relatedScroll.scrollLeft;});
relatedScroll.addEventListener('mouseleave',()=>{isDown=false;relatedScroll.classList.remove('dragging');});
relatedScroll.addEventListener('mouseup',()=>{isDown=false;relatedScroll.classList.remove('dragging');});
relatedScroll.addEventListener('mousemove',e=>{if(!isDown)return;e.preventDefault();const x=e.pageX-relatedScroll.offsetLeft;const walk=(x-startX)*1.5;relatedScroll.scrollLeft=scrollLeft-walk;});
closeBtn.onclick=()=>{playerPage.style.display='none';stopPlayback();playerOpen=false;localStorage.removeItem('activeVideoId');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&playerOpen){playerPage.style.display='none';stopPlayback();playerOpen=false;localStorage.removeItem('activeVideoId');}});
window.addEventListener('pagehide',stopPlayback);
window.addEventListener('beforeunload',stopPlayback);

/* ===== القنوات الفضائية ===== */
var satVideoEl=document.getElementById('satVideoEl'),satWrapEl=document.getElementById('satVideoWrap'),satGridEl=document.getElementById('satGrid'),satMsgEl=document.getElementById('satMsg'),satRetryKidsBtn=document.getElementById('satRetryKidsBtn');

function satBuildCards(){
  var lines=document.getElementById('satData').value.split('\n').map(function(l){return l.trim();}).filter(function(l){return l.length>0;});
  satGridEl.innerHTML='';
  for(var i=0;i+2<lines.length;i+=3){
    (function(name,image,video){
      var a=document.createElement('a');a.href='#';a.className='card-sat';
      var img=document.createElement('img');img.src=image;img.alt=name;
      var title=document.createElement('div');title.className='card-title-sat';title.textContent=name;
      a.appendChild(img);a.appendChild(title);
      a.addEventListener('click',function(e){e.preventDefault();if(!video)return;satGridEl.style.display='none';document.getElementById('satPlayer').style.display='block';satPlayVideo(video);});
      satGridEl.appendChild(a);
    })(lines[i],lines[i+1],lines[i+2]);
  }
}

function satShowMsg(text){satMsgEl.textContent=text;satMsgEl.style.display='block';satRetryKidsBtn.hidden=!/^⚠/.test(text);}
function satHideMsg(){satMsgEl.style.display='none';satMsgEl.textContent='';satRetryKidsBtn.hidden=true;}
satRetryKidsBtn.addEventListener('click',function(){satFallbackCycle=0;if(!satActiveUrl)return;if(satKidsPlayerMode==='backup'){satPlayBackupVideo(satActiveUrl);}else{satPlayVideo(satActiveUrl);}});

function satToYouTubeEmbed(url){var m;if((m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/live\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/))){return 'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&rel=0';}return null;}
function satToVimeoEmbed(url){var m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1]+'?autoplay=1';return null;}
function satToFacebookEmbed(url){return 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(url)+'&autoplay=1';}
function satToDailymotionEmbed(url){var m=url.match(/dailymotion\.com\/video\/([A-Za-z0-9]+)/);if(m)return 'https://www.dailymotion.com/embed/video/'+m[1]+'?autoplay=1';return null;}
function satToTwitchEmbed(url){var m=url.match(/twitch\.tv\/([A-Za-z0-9_]+)/);if(m)return 'https://player.twitch.tv/?channel='+m[1]+'&parent='+location.hostname+'&autoplay=true';return null;}
function satToStreamableEmbed(url){var m=url.match(/streamable\.com\/([A-Za-z0-9]+)/);if(m)return 'https://streamable.com/e/'+m[1]+'?autoplay=1';return null;}
function satToTwitterEmbed(url){if(/twitter\.com|x\.com/.test(url))return 'https://twitframe.com/show?url='+encodeURIComponent(url);return null;}
function satToOkEmbed(url){var m=url.match(/ok\.ru\/video\/(\d+)/);if(m)return 'https://ok.ru/videoembed/'+m[1]+'?autoplay=1';return null;}
function satToVkEmbed(url){var m=url.match(/vk\.com\/video(-?\d+)_(\d+)/);if(m)return 'https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2]+'&autoplay=1';return null;}
function satToRumbleEmbed(url){var m=url.match(/rumble\.com\/(?:embed\/)?([A-Za-z0-9]+)/);if(m)return 'https://rumble.com/embed/'+m[1]+'/';return null;}
function satToBitchuteEmbed(url){var m=url.match(/bitchute\.com\/video\/([A-Za-z0-9]+)/);if(m)return 'https://www.bitchute.com/embed/'+m[1]+'/';return null;}
function satToOdyseeEmbed(url){var m=url.match(/odysee\.com\/.*[:/]([A-Za-z0-9]+)/);if(m)return 'https://odysee.com/$/embed/'+m[1];return null;}
function satToArchiveEmbed(url){var m=url.match(/archive\.org\/details\/([^\/\?]+)/);if(m)return 'https://archive.org/embed/'+m[1];return null;}
function satToMp4UploadEmbed(url){var m=url.match(/mp4upload\.com\/(?:embed-)?([A-Za-z0-9]+)/);if(m)return 'https://www.mp4upload.com/embed-'+m[1]+'.html';return null;}
function satToDoodEmbed(url){var m=url.match(/dood(?:stream|\.)?\.?(?:com|to|so|pm|watch|sh|re|la|ws|gs|life|yt|li|si|cf|wtf|best|cx|nu|vip)\/(?:e|d)\/([A-Za-z0-9]+)/i);if(m)return 'https://dood.to/e/'+m[1];return null;}

function satIsHls(url){return /\.m3u8(\?.*)?$/i.test(url)||/format=m3u8/i.test(url);}
function satIsDash(url){return /\.mpd(\?.*)?$/i.test(url)||/format=mpd/i.test(url);}
function satIsFlv(url){return /\.flv(\?.*)?$/i.test(url);}
function satIsMkv(url){return /\.mkv(\?.*)?$/i.test(url);}
function satIsTs(url){return /\.ts(\?.*)?$/i.test(url);}
function satIsDirectVideo(url){return /\.(mp4|webm|ogg|ogv|mov|m4v|3gp|m4s|mp3|aac|m4a)(\?.*)?$/i.test(url);}
function satIsRtmp(url){return /^rtmp:\/\//i.test(url);}
function satIsRtsp(url){return /^rtsp:\/\//i.test(url);}

var satActiveEngine='native',satActiveUrl='',satKidsPlayerMode='primary',satFallbackCycle=0,satActiveHls=null,satActiveShaka=null,satActiveVideoJs=null,satActiveDplayer=null,satActiveClappr=null,satEngineTimer=null,satEngineToken=0,satQualitySources=[],satQualityIndex=0;

function satSetKidsPlayerMode(mode){satKidsPlayerMode=mode;var engineSelect=document.getElementById('satEngineSelect'),qualityMenu=document.querySelector('#satPlayer .quality-menu'),primaryButton=document.getElementById('satPrimaryPlayerBtn'),backupButton=document.getElementById('satBackupPlayerBtn');if(engineSelect)engineSelect.style.display=mode==='primary'?'':'none';if(qualityMenu)qualityMenu.style.display=mode==='primary'?'':'none';if(primaryButton)primaryButton.classList.toggle('active',mode==='primary');if(backupButton)backupButton.classList.toggle('active',mode==='backup');}

function satStopKidsMedia(){document.querySelectorAll('#satContent audio, #satContent video').forEach(function(media){try{media.pause();media.muted=true;media.volume=0;media.removeAttribute('src');media.load();}catch(e){}});document.querySelectorAll('#satVideoWrap iframe').forEach(function(frame){frame.remove();});}

function satResetPlayers(){satEngineToken++;if(satEngineTimer){clearTimeout(satEngineTimer);satEngineTimer=null;}satStopKidsMedia();try{if(satActiveHls)satActiveHls.destroy();}catch(e){}try{if(satActiveShaka)satActiveShaka.destroy();}catch(e){}try{if(satActiveVideoJs)satActiveVideoJs.dispose();}catch(e){}try{if(satActiveDplayer)satActiveDplayer.destroy();}catch(e){}try{if(satActiveClappr)satActiveClappr.destroy();}catch(e){}satActiveHls=null;satActiveVideoJs=null;satActiveDplayer=null;satActiveClappr=null;satActiveShaka=null;satWrapEl.querySelectorAll('[data-player-host]').forEach(function(host){host.remove();});satVideoEl.style.display='block';satVideoEl.controls=true;satQualitySources=[];satQualityIndex=0;document.getElementById('satQualityToggle').style.display='none';document.getElementById('satQualityOptions').innerHTML='';document.getElementById('satQualityOptions').classList.remove('open');satHideMsg();}

function satQualityLabel(level,index){var name=level.name||(level.attrs&&level.attrs.NAME)||(level.attributes&&level.attributes.NAME);if(name)return String(name);if(level.height)return level.height+'p';if(level.bitrate)return Math.round(level.bitrate/1000)+'kbps';return 'جودة '+(index+1);}

function satShowQualities(hls,token){var levels=hls.levels||[];if(token!==satEngineToken||levels.length<2)return;satQualitySources=levels.map(function(level,index){return {label:satQualityLabel(level,index),index:index};});var toggle=document.getElementById('satQualityToggle'),options=document.getElementById('satQualityOptions');toggle.style.display='inline-block';options.innerHTML='';satQualitySources.forEach(function(source,index){var button=document.createElement('button');button.type='button';button.textContent=source.label;button.onclick=function(){satQualityIndex=index;hls.currentLevel=source.index;options.classList.remove('open');};options.appendChild(button);});}

function satCreateHost(id){var host=document.createElement('div');host.id=id;host.dataset.playerHost='true';host.style.cssText='position:absolute;inset:0;width:100%;height:100%;background:#000;';satWrapEl.appendChild(host);return host;}

function satPlayWithEngine(url,engine,token,failed){
  satActiveEngine=engine;
  satVideoEl.style.display=engine==='native'||engine==='videojs'||engine==='hlsjs'?'block':'none';
  try{
    if(engine==='videojs'&&window.videojs){satActiveVideoJs=videojs(satVideoEl,{autoplay:true,controls:true,responsive:true,fluid:false});satActiveVideoJs.src({src:url,type:'application/x-mpegURL'});satActiveVideoJs.on('playing',function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveVideoJs.on('error',function(){if(token===satEngineToken)failed();});satActiveVideoJs.play().catch(function(){});return;}
    if(engine==='hlsjs'&&window.Hls&&Hls.isSupported()){satActiveHls=new Hls();satActiveHls.loadSource(url);satActiveHls.attachMedia(satVideoEl);satActiveHls.on(Hls.Events.MANIFEST_PARSED,function(){satShowQualities(satActiveHls,token);satVideoEl.play().catch(function(){});});satActiveHls.on(Hls.Events.FRAG_LOADED,function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveHls.on(Hls.Events.ERROR,function(event,data){if(data&&data.fatal&&token===satEngineToken)failed();});return;}
    if(engine==='shaka'&&window.shaka&&shaka.Player.isBrowserSupported()){satActiveShaka=new shaka.Player(satVideoEl);satActiveShaka.load(url).then(function(){satVideoEl.play().then(function(){if(token===satEngineToken)satFinishKidsEngine(token);}).catch(function(){if(token===satEngineToken)failed();});}).catch(function(){if(token===satEngineToken)failed();});return;}
    if(engine==='dplayer'&&window.DPlayer){var dHost=satCreateHost('sat-dplayer-host');satActiveDplayer=new DPlayer({container:dHost,autoplay:true,video:{url:url,type:'hls'}});satActiveDplayer.on('playing',function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveDplayer.on('error',function(){if(token===satEngineToken)failed();});return;}
    if(engine==='clappr'&&window.Clappr){var cHost=satCreateHost('sat-clappr-host');satActiveClappr=new Clappr.Player({source:url,parentId:'#'+cHost.id,autoPlay:true,mute:false});satActiveClappr.on(Clappr.Events.PLAYER_READY,function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveClappr.on(Clappr.Events.PLAYER_ERROR,function(){if(token===satEngineToken)failed();});return;}
    if(engine==='native'){satVideoEl.src=url;satVideoEl.onplaying=function(){if(token===satEngineToken)satFinishKidsEngine(token);};satVideoEl.onerror=function(){if(token===satEngineToken)failed();};satVideoEl.play().catch(function(){});return;}
  }catch(e){failed();}
  failed();
}

function satFinishKidsEngine(token){if(token!==satEngineToken)return;if(satEngineTimer){clearTimeout(satEngineTimer);satEngineTimer=null;}}

function satPlayVideo(url,automatic){
  satResetPlayers();satActiveUrl=url;
  if(!automatic)satFallbackCycle=0;
  satSetKidsPlayerMode('primary');satHideMsg();
  var token=satEngineToken;
  var selected=document.getElementById('satEngineSelect').value;
  var engines=selected==='auto'?['hlsjs','native','shaka']:[selected,'hlsjs','native','shaka'];
  var index=0;
  function next(){
    if(token!==satEngineToken)return;
    if(index>=engines.length){
      if(satFallbackCycle===0){satFallbackCycle=1;satShowMsg('⚠ تعذر التشغيل، جاري الانتقال للمشغل الاحتياطي...');setTimeout(function(){if(token===satEngineToken&&satActiveUrl===url)satPlayBackupVideo(url);},500);}
      else{satShowMsg('⚠ تعذر تشغيل رابط البث بالمشغلين المتاحين.');}
      return;
    }
    var engine=engines[index++];
    satResetPlayersForEngine();
    satPlayWithEngine(url,engine,token,next);
    satEngineTimer=setTimeout(function(){if(token===satEngineToken)next();},6000);
  }
  next();
}

function satPlayBackupVideo(url){
  satResetPlayers();satActiveUrl=url;satSetKidsPlayerMode('backup');satHideMsg();
  if(!window.shaka||!shaka.Player.isBrowserSupported()){satShowMsg('⚠ المشغل الاحتياطي غير مدعوم في هذا المتصفح.');return;}
  try{satActiveShaka=new shaka.Player(satVideoEl);satActiveShaka.load(url).then(function(){satVideoEl.play().catch(function(){});}).catch(function(){satShowMsg('⚠ فشل المشغل الاحتياطي، جاري الرجوع للمشغل الرئيسي...');setTimeout(function(){if(satActiveUrl===url&&satKidsPlayerMode==='backup')satPlayVideo(url,true);},1000);});}catch(e){satShowMsg('⚠ تعذر تشغيل المشغل الاحتياطي.');}
}

function satResetPlayersForEngine(){
  if(satEngineTimer){clearTimeout(satEngineTimer);satEngineTimer=null;}
  try{if(satActiveHls)satActiveHls.destroy();}catch(e){}
  try{if(satActiveShaka)satActiveShaka.destroy();}catch(e){}
  try{if(satActiveVideoJs)satActiveVideoJs.dispose();}catch(e){}
  try{if(satActiveDplayer)satActiveDplayer.destroy();}catch(e){}
  try{if(satActiveClappr)satActiveClappr.destroy();}catch(e){}
  satActiveHls=null;satActiveShaka=null;satActiveVideoJs=null;satActiveDplayer=null;satActiveClappr=null;
  satWrapEl.querySelectorAll('[data-player-host]').forEach(function(host){host.remove();});
  satVideoEl.pause();satVideoEl.removeAttribute('src');satVideoEl.load();satVideoEl.style.display='block';
  satEnsureKidsVideo();
}

function satEnsureKidsVideo(){
  if(satWrapEl.contains(satVideoEl))return;
  satVideoEl=document.createElement('video');satVideoEl.id='satVideoEl';satVideoEl.controls=true;satVideoEl.autoplay=true;satVideoEl.playsInline=true;
  satWrapEl.insertBefore(satVideoEl,satWrapEl.firstChild);
}

document.getElementById('satQualityToggle').onclick=function(event){event.stopPropagation();document.getElementById('satQualityOptions').classList.toggle('open');};
document.getElementById('satEngineSelect').onchange=function(){if(satActiveUrl)satPlayVideo(satActiveUrl);};
document.getElementById('satPrimaryPlayerBtn').onclick=function(){satSetKidsPlayerMode('primary');if(satActiveUrl)satPlayVideo(satActiveUrl);};
document.getElementById('satBackupPlayerBtn').onclick=function(){satSetKidsPlayerMode('backup');if(satActiveUrl)satPlayBackupVideo(satActiveUrl);};
document.addEventListener('click',function(event){if(!event.target.closest('#satPlayer .quality-menu'))document.getElementById('satQualityOptions').classList.remove('open');});
window.addEventListener('pagehide',function(){satResetPlayers();});
window.addEventListener('beforeunload',function(){satResetPlayers();});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')satResetPlayers();});

satBuildCards();

/* ===== التشغيل الأولي: البقاء على نفس التصنيف أو نفس الفيديو ===== */
(function init(){
  const savedCat=localStorage.getItem('activeCat')||'all';
  const savedVideoId=localStorage.getItem('activeVideoId');
  setCategory(savedCat);

  if(savedVideoId){
    // حاول إيجاد الفيديو في القسم النشط
    const list=currentVideos;
    const idx=list.findIndex(v=>v.id===savedVideoId);
    if(idx>=0){
      openPlayer(list,idx,false);
    }else{
      // ابحث في كل الفيديوهات
      const all=getVideosForCat('all');
      const ai=all.findIndex(v=>v.id===savedVideoId);
      if(ai>=0)openPlayer(all,ai,false);
    }
  }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });

(function(){
  function ensureErrorBox(){
    if(document.getElementById('__appErrorBox__'))return document.getElementById('__appErrorBox__');
    var box=document.createElement('div');
    box.id='__appErrorBox__';
    box.style.cssText='position:fixed;left:50%;top:10px;transform:translateX(-50%);max-width:96vw;min-width:240px;z-index:2147483647;background:#b71c1c;color:#fff;font:700 13px/1.4 Cairo,Arial,sans-serif;padding:12px 14px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.5);word-break:break-word;text-align:right;direction:rtl;';
    if(document.body)document.body.appendChild(box);else document.documentElement.appendChild(box);
    return box;
  }
  function addErr(head,msg){
    try{
      var box=ensureErrorBox();
      if(!box)return;
      var line=document.createElement('div');
      line.style.cssText='margin:4px 0;padding:0;';
      line.textContent=(head?'⛔ '+head+': ':'')+(msg||'خطأ غير معروف');
      box.appendChild(line);
      box.style.display='block';
    }catch(e){}
  }
  window.onerror=function(msg,url,line,col,err){
    addErr('خطأ JS',(msg||'')+' (السطر '+(line||'?')+') '+(err&&err.stack?String(err.stack).slice(0,400):''));
    try{
      var s=document.getElementById('splashScreen');if(s){s.style.transition='none';s.style.display='none';s.style.visibility='hidden';try{s.remove();}catch(z){}}
    }catch(z){}
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    var m=(e&&e.reason)?(typeof e.reason==='object'?(e.reason.message||e.reason.stack||String(e.reason)):String(e.reason)):'Promise مرفوض';
    addErr('خطأ غير معالج',String(m).slice(0,500));
  });
  window.__showAppError=addErr;
})();
</script>
<link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;font-family:'Cairo',sans-serif;background:#0f0f3d;color:#fff;}

/* ===== Splash / Loader ===== */
#splashScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease;}
#splashScreen.hide{opacity:0;pointer-events:none;}
#splashLogo{max-width:55vw;max-height:32vh;width:auto;height:auto;object-fit:contain;display:block;}
.splash-spinner{width:48px;height:48px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ff6600;border-right-color:#ff6600;animation:spin 1s linear infinite;}
#splashText{color:#fff;font-size:14px;font-weight:700;}
#splashRetry{display:none;background:#ff6600;color:#fff;border:none;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;}
@keyframes spin{to{transform:rotate(360deg);}}
.global-failure{display:none;position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:rgba(255,0,51,.92);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;max-width:92vw;}
.global-failure.show{display:block;}

/* ===== Card/Thumb loaders ===== */
.thumb-wrap .card-loader,.related-thumb .card-loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:1;}
.thumb-wrap .card-loader.hidden,.related-thumb .card-loader.hidden{display:none;}
.card-spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#ff6600;border-right-color:#ff6600;animation:spin .8s linear infinite;}
.thumb-wrap img.broken,.related-thumb img.broken{opacity:0;}
.thumb-broken,.related-broken{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:#1c1c5c;color:#bbb;font-size:11px;font-weight:700;z-index:1;}
.thumb-broken.show,.related-broken.show{display:flex;}

/* ===== Favorites button (بلا تغيير للتصميم الأصلي للبطاقة) ===== */
.card,.related-card,.card-sat{position:relative;}
.fav-btn{position:absolute;top:6px;right:6px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;backdrop-filter:blur(2px);}
.fav-btn svg{width:16px;height:16px;display:block;fill:transparent;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;transition:fill .2s ease, stroke .2s ease;}
.fav-btn.active svg{fill:#ffb400;stroke:#ffb400;}
.related-card .fav-btn{top:4px;right:4px;width:24px;height:24px;}
.related-card .fav-btn svg{width:14px;height:14px;}
.card-sat .fav-btn{top:4px;right:4px;width:24px;height:24px;background:rgba(255,255,255,.8);}
.card-sat .fav-btn svg{stroke:#333;}
.card-sat .fav-btn.active svg{fill:#ffb400;stroke:#ffb400;}
.fav-empty{grid-column:1/-1;text-align:center;color:#888;padding:40px 10px;font-size:14px;}
.fav-btn:hover{transform:scale(1.05);}

/* ===== Duration + views ===== */
.duration-views{position:absolute;bottom:6px;left:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;pointer-events:none;}
.views-pill{background:rgba(255,102,0,.85);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;}
.related-duration-views{position:absolute;bottom:4px;left:4px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;pointer-events:none;}
.related-duration-views .views-pill{font-size:9px;padding:1px 4px;}

/* ===== Player loaders / failure ===== */
.player-loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.55);z-index:4;color:#fff;font-size:13px;font-weight:700;}
.player-loader.show{display:flex;}
.player-loader .splash-spinner{width:40px;height:40px;}
.player-failure{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.85);z-index:5;color:#fff;padding:16px;text-align:center;}
.player-failure.show{display:flex;}
.player-failure p{margin:0;font-size:13px;}
.player-failure button{background:#ff6600;border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;}

.header-bar{position:sticky;top:0;z-index:50;background:#0f0f3d;}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;}
.header-logo{height:38px;width:auto;display:block;}
.header-actions{display:flex;align-items:center;gap:8px;}
.search-btn, .header-fav-btn{background:none;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.search-btn:hover, .header-fav-btn:hover{background:#1c1c5c;}
.search-btn svg, .header-fav-btn svg{width:24px;height:24px;fill:#fff;display:block;}
.header-fav-btn.active svg{fill:#ffb400;stroke:#ffb400;}
@media (max-width: 450px){.header-logo{height:32px;}.search-btn svg, .header-fav-btn svg{width:22px;height:22px;}}
.cats-bar{background:#0f0f3d;padding:6px 10px 10px;}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;background:#1c1c5c;border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:8px;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;}
.cat.active{background:#fff;color:#000}
.cat .ico{display:inline-block;width:16px;height:16px;color:#fff;line-height:1;flex-shrink:0;}
.cat.active .ico{color:#000}
.cat .ico svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width: 600px){.cats-bar{padding:5px 8px 8px;}.cats{gap:5px;}.cat{font-size:12px;padding:7px 12px;gap:4px;}.cat .ico{width:14px;height:14px;}}
@media (max-width: 450px){.cats-bar{padding:5px 6px 8px;}.cats{gap:4px;}.cat{font-size:11px;padding:6px 10px;gap:3px;}.cat .ico{width:13px;height:13px;}}
@media (max-width: 360px){.cats-bar{padding:5px 5px 8px;}.cats{gap:3px;}.cat{font-size:10px;padding:5px 8px;gap:2px;}.cat .ico{width:12px;height:12px;}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;}
.card{background:#000;border:none;padding:6px;display:flex;flex-direction:column;cursor:pointer;font:inherit;color:inherit;text-align:right;border-radius:14px;}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#222;border-radius:10px;}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.card-title{font-size:13px;font-weight:700;color:#fff;background:transparent;padding:8px 4px 4px 24px;margin:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;position:relative;text-align:right;min-height:44px;}
.card-title::after{content:"⋮";position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:18px;color:#aaa;}
#playerPage{display:none;background:#000;}
.player-top{position:relative;width:100%;aspect-ratio:16/9;background:#000;}
#youtubeFrame{width:100%;height:100%;border:none;}
#ytPoster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;display:none;}
.close-btn{
  position:absolute;top:12px;right:12px;z-index:3;
  background:rgba(15,15,61,.7);backdrop-filter:blur(6px);
  color:#fff;border:1px solid rgba(255,255,255,.15);
  width:34px;height:34px;border-radius:999px;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.close-btn:hover{background:rgba(255,94,94,.9);border-color:rgba(255,255,255,.2);}
.close-btn:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,0));}
.related{padding:14px 0 30px;background:#000;}
.related h3{font-size:14px;color:#fff;margin:0 12px 10px;}
.related-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;cursor:grab;}
.related-scroll::-webkit-scrollbar{display:none}
.related-scroll.dragging{cursor:grabbing}
.related-card{flex:0 0 200px;background:#000;border:none;padding:5px;cursor:pointer;text-align:right;font:inherit;color:inherit;border-radius:12px;}
.related-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#222;border-radius:8px;}
.related-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.related-title{font-size:12px;font-weight:700;color:#fff;background:transparent;padding:6px 4px 4px 4px;margin:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
#satPage{display:none;}
#satContent{text-align:center;background:#0f0f3d;}
#satContent .grid-sat{display:grid;grid-template-columns:repeat(auto-fit,120px);gap:16px;padding:16px;max-width:1200px;margin:0 auto;justify-content:center;}
#satContent .card-sat{width:120px;background:linear-gradient(135deg,#fff 0%,#e8e8e8 50%,#d4d4d4 100%);border-radius:12px;text-decoration:none;padding:8px;display:flex;flex-direction:column;align-items:center;transition:transform .2s ease;box-shadow:0 4px 8px rgba(0,0,0,.1);cursor:pointer;box-sizing:border-box;}
#satContent .card-sat:hover{transform:scale(1.03);box-shadow:0 6px 12px rgba(0,0,0,.15);}
#satContent .card-sat img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;}
#satContent .card-title-sat{font-size:11px;color:#333;margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold;width:100%;}
#satPlayer{display:none;max-width:900px;margin:20px auto;padding:16px;}
#satPlayer .video-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3);background:#000;aspect-ratio:16/9;}
#satPlayer video,#satPlayer iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000;}
#satMsg{color:#fff;background:rgba(0,0,0,.7);padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none;}
#satPlayer .player-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:10px;}
#satPlayer .player-controls select,#satPlayer .quality-button,#satPlayer .quality-toggle{border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;font:inherit;cursor:pointer;}
#satPlayer .player-switch{border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;font:inherit;cursor:pointer;}
#satPlayer .player-switch:hover,#satPlayer .player-switch.active{background:#ff6600;}
#satPlayer .retry-switch{order:-1;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.75);color:#fff;width:34px;height:34px;padding:0;font:inherit;font-size:20px;font-weight:900;cursor:pointer;}
#satPlayer .retry-switch:hover{background:#ff6600;transform:rotate(90deg);}
#satPlayer .retry-switch[hidden]{display:none;}
#satPlayer .quality-button.active,#satPlayer .quality-button:hover,#satPlayer .quality-toggle:hover{background:#ff6600;}
#satPlayer .quality-toggle{display:none;}
#satPlayer .quality-menu{position:relative;display:inline-flex;}
#satPlayer .quality-options{position:absolute;bottom:calc(100% + 6px);right:0;display:none;min-width:130px;padding:5px;border-radius:8px;background:rgba(0,0,0,.9);z-index:4;}
#satPlayer .quality-options.open{display:grid;gap:4px;}
#satPlayer .quality-options button{border:0;border-radius:5px;padding:7px 9px;background:transparent;color:#fff;cursor:pointer;text-align:right;}
#satPlayer .quality-options button:hover{background:#ff6600;}
#ourLivePage{display:none;width:100%;height:calc(100vh - 110px);}
#ourLiveFrame{width:100%;height:100%;border:none;background:#0f0f3d;display:block;}
#searchPage{display:none;padding:12px;}
#searchInput{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:#1c1c5c;color:#fff;font-family:inherit;font-size:14px;font-weight:700;outline:none;box-sizing:border-box;}
#searchInput::placeholder{color:#888;}
#searchEmpty{text-align:center;color:#888;padding:40px 20px;font-size:14px;}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(function(){
  function killSplash(){
    try{
      var el=document.getElementById('splashScreen');
      if(el){el.style.transition='none';el.style.display='none';el.style.visibility='hidden';el.style.opacity='0';el.style.pointerEvents='none';try{el.remove();}catch(e){}}
    }catch(e){}
  }
  setTimeout(killSplash,700);setTimeout(killSplash,1500);setTimeout(killSplash,2500);
  try{window.addEventListener('load',killSplash,{once:true});}catch(e){}
  try{document.addEventListener('DOMContentLoaded',killSplash,{once:true});}catch(e){}
})();
</script>

function loadFav(key){try{var raw=localStorage.getItem(key);return raw?JSON.parse(raw):[];}catch(e){return [];}}
function saveFav(key,arr){try{localStorage.setItem(key,JSON.stringify(arr));}catch(e){}}
function toggleArray(arr,item){var i=arr.indexOf(item);if(i>=0){arr.splice(i,1);return false;}arr.push(item);return true;}
function isFavYT(id){return loadFav(FAV_YT_KEY).indexOf(String(id))>=0;}
function toggleFavYT(id){var arr=loadFav(FAV_YT_KEY);var added=toggleArray(arr,String(id));saveFav(FAV_YT_KEY,arr);refreshActiveFavorites();return added;}
function satFavKey(name,url){return btoa(unescape(encodeURIComponent(String(name||'')+'|'+String(url||'')))).replace(/[^A-Za-z0-9_-]/g,'');}
function isFavSAT(name,url){return loadFav(FAV_SAT_KEY).indexOf(satFavKey(name,url))>=0;}
function toggleFavSAT(name,url){var arr=loadFav(FAV_SAT_KEY);var k=satFavKey(name,url);var added=toggleArray(arr,k);saveFav(FAV_SAT_KEY,arr);return added;}

/* ===== Duration + Views ===== */
var META_CACHE_KEY='yt_meta_v2';
var VIEWS_KEY='yt_views_v1';
function loadMetaCache(){try{var s=localStorage.getItem(META_CACHE_KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function saveMetaCache(c){try{localStorage.setItem(META_CACHE_KEY,JSON.stringify(c));}catch(e){}}
var metaCache=loadMetaCache();
function loadViews(){try{var s=localStorage.getItem(VIEWS_KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function saveViews(m){try{localStorage.setItem(VIEWS_KEY,JSON.stringify(m));}catch(e){}}
var viewsMap=loadViews();
function formatDuration(sec){
  if(!sec||isNaN(sec)||sec<0)return null;
  sec=Math.floor(sec);
  var h=Math.floor(sec/3600);
  var m=Math.floor((sec%3600)/60);
  var s=sec%60;
  var pad=function(n){return String(n).padStart(2,'0');};
  if(h>0)return h+':'+pad(m)+':'+pad(s);
  return m+':'+pad(s);
}
function formatViews(n){
  n=Number(n)||0;
  if(n<1)return null;
  if(n>=1000000)return (n/1000000).toFixed(n%1000000===0?0:1)+'M مشاهدة';
  if(n>=1000)return Math.floor(n/1000)+'K مشاهدة';
  return n+' مشاهدة';
}
var metaQueue={};
function fetchYouTubeMeta(videoId){
  videoId=String(videoId||'');
  if(!videoId)return Promise.resolve(null);
  if(metaCache[videoId]!==undefined)return Promise.resolve(metaCache[videoId]||null);
  if(metaQueue[videoId])return metaQueue[videoId];
  var p=new Promise(function(resolve){
    var url='https://noembed.com/embed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D'+encodeURIComponent(videoId);
    fetch(url,{method:'GET',cache:'no-store'}).then(function(r){
      return r&&r.ok?r.json():null;
    }).then(function(d){
      var out=null;
      if(d){out={title:d.title||null,duration:Number(d.duration)||0,author_name:d.author_name||null};}
      metaCache[videoId]=out;
      saveMetaCache(metaCache);
      resolve(out);
    }).catch(function(){
      metaCache[videoId]=null;
      saveMetaCache(metaCache);
      resolve(null);
    });
  });
  metaQueue[videoId]=p;
  p.finally(function(){delete metaQueue[videoId];});
  return p;
}
function bumpViews(id){if(!id)return;var k=String(id);viewsMap[k]=(Number(viewsMap[k])||0)+1;saveViews(viewsMap);}
function getViews(id){return Number(viewsMap[String(id)])||0;}
var STAR_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/></svg>';

function buildYTThumbWrap(v,isRelated){
  var vId=v.id;
  var views=formatViews(getViews(vId));
  var wrapClass=isRelated?'related-thumb':'thumb-wrap';
  var inner=[];
  inner.push('<div class="card-loader" role="status"><div class="card-spinner"></div></div>');
  inner.push('<img src="https://i.ytimg.com/vi/'+vId+'/hqdefault.jpg" alt="" loading="lazy">');
  inner.push('<div class="'+(isRelated?'related-broken':'thumb-broken')+'"><div>⚠️</div><div>تعذر تحميل الصورة</div></div>');
  inner.push('<div class="'+(isRelated?'related-duration-views':'duration-views')+'">'+(views?'<span class="views-pill">'+views+'</span>':'')+'</div>');
  return '<div class="'+wrapClass+'">'+inner.join('')+'</div>';
}
function buildFallbackThumbData(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#1f5eff"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs><rect width="640" height="360" fill="#0f0f3d"/><rect x="28" y="26" width="584" height="308" rx="18" fill="url(#g)" opacity="0.2"/><circle cx="320" cy="150" r="78" fill="#ffffff" opacity="0.12"/><path d="M288 206l36-36 36 36 48-48 52 52v62H240v-62l48-48z" fill="#ffffff" opacity="0.18"/><text x="320" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" font-weight="700">Kids TV</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function attachThumbLoaders(card,isRelated){
  if(!card)return;
  var imgs=card.querySelectorAll(isRelated?'.related-thumb img':'.thumb-wrap img');
  imgs.forEach(function(img){
    var loader=img.parentElement.querySelector('.card-loader');
    var broken=img.parentElement.querySelector(isRelated?'.related-broken':'.thumb-broken');
    img.onerror=function(){
      if(!img.dataset.fallbackApplied){
        img.dataset.fallbackApplied='1';
        img.src=buildFallbackThumbData();
      }
      if(loader)loader.classList.add('hidden');
      img.classList.add('broken');
      if(broken)broken.classList.add('show');
    };
    if(loader){
      if(img.complete&&img.naturalWidth>0){
        loader.classList.add('hidden');
      }else{
        var onLoad=function(){
          if(loader)loader.classList.add('hidden');
          img.removeEventListener('load',onLoad);
        };
        img.addEventListener('load',onLoad);
        if(img.complete&&img.naturalWidth===0&&img.src){
          img.onerror();
        }
      }
    }
  });
}
function addYTFrameMetaCard(card,v,isRelated){
  if(!card||!v)return;

    var m=metaCache[v.id];
    if(m.title&&v&&!v.title)v.title=m.title;
    var titleEl2=card.querySelector(isRelated?'.related-title':'.card-title');
    if(titleEl2&&m.title&&!titleEl2.textContent)titleEl2.textContent=m.title;
    var viewsWrap2=card.querySelector(isRelated?'.related-duration-views':'.duration-views');

        viewsWrap2.appendChild(pill2);
      }
    }
  }
}

/* ===== YouTube ID ===== */
function getYouTubeId(url){
  if(!url)return null;
  var s=String(url).trim();
  try{
    var id=null;
    if(s.indexOf('youtu.be/')>=0){
      var p1=s.split('youtu.be/')[1];
      if(p1){p1=p1.split(/[?&#]/)[0];id=p1.split('/')[0];}
    }else if((s.indexOf('youtube.com/')>=0)||(s.indexOf('youtube-nocookie.com/')>=0)){
      var vm=s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
      if(vm){id=vm[1];}
      else{
        var pm=s.match(/\/(embed|live|shorts|v)\/([A-Za-z0-9_-]{11})/);
        if(pm)id=pm[2];
      }
    }
    if(!id)return null;
    if(/^[A-Za-z0-9_-]{11}$/.test(id))return id;
    return null;
  }catch(e){return null;}
}

var TITLE_CACHE_KEY='yt_titles_v1';
function loadTitleCache(){try{var s=localStorage.getItem(TITLE_CACHE_KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function saveTitleCache(cache){try{localStorage.setItem(TITLE_CACHE_KEY,JSON.stringify(cache));}catch(e){}}
var titleCache=loadTitleCache();

function fetchYouTubeTitle(videoId){
  return Promise.resolve(fetchYouTubeMeta(videoId)).then(function(m){
    if(m&&m.title){return m.title;}
    if(titleCache[videoId]!==undefined){return titleCache[videoId];}
    return new Promise(function(resolve){
      var api='https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+videoId+'&format=json';
      fetch(api).then(function(r){return r&&r.ok?r.json():null;}).then(function(data){
        var t=(data&&data.title)?data.title:null;titleCache[videoId]=t;saveTitleCache(titleCache);resolve(t);
      }).catch(function(){titleCache[videoId]=null;saveTitleCache(titleCache);resolve(null);});
    });
  });
}

function parseUrls(data){
  try{
    if(!data){return [];}
    var lines=String(data).trim().split('\n').map(function(l){return String(l).trim();}).filter(function(l){return l!=='';});
    var list=[];
    for(var i=0;i<lines.length;i++){
      var url=lines[i];
      var id=getYouTubeId(url);
      if(id){
        var m=metaCache[id];
        list.push({id:id,title:(m&&m.title)?m.title:(titleCache[id]||'')});
      }
    }
    return list;
  }catch(e){try{if(window.__showAppError)window.__showAppError('خطأ parseUrls',String(e.message||e));}catch(z){}return [];}
}

var satActiveEngine='native',satActiveUrl='',satActiveName='',satActiveImage='',satKidsPlayerMode='primary',satFallbackCycle=0,satActiveHls=null,satActiveShaka=null,satActiveVideoJs=null,satActiveDplayer=null,satActiveClappr=null,satEngineTimer=null,satEngineToken=0,satQualitySources=[],satQualityIndex=0;

function satSetKidsPlayerMode(mode){satKidsPlayerMode=mode;var engineSelect=document.getElementById('satEngineSelect'),qualityMenu=document.querySelector('#satPlayer .quality-menu'),primaryButton=document.getElementById('satPrimaryPlayerBtn'),backupButton=document.getElementById('satBackupPlayerBtn');if(engineSelect)engineSelect.style.display=mode==='primary'?'':'none';if(qualityMenu)qualityMenu.style.display=mode==='primary'?'':'none';if(primaryButton)primaryButton.classList.toggle('active',mode==='primary');if(backupButton)backupButton.classList.toggle('active',mode==='backup');}

function satResetPlayers(){
  satEngineToken++;

  satStopKidsMedia();
  try{if(satActiveHls)satActiveHls.destroy();}catch(e){}
  try{if(satActiveShaka)satActiveShaka.destroy();}catch(e){}

  try{if(satActiveDplayer)satActiveDplayer.destroy();}catch(e){}
  try{if(satActiveClappr)satActiveClappr.destroy();}catch(e){}
  satActiveHls=null;satActiveVideoJs=null;satActiveDplayer=null;satActiveClappr=null;satActiveShaka=null;

    satWrapEl.querySelectorAll('[data-player-host]').forEach(function(host){host.remove();});

function satQualityLabel(level,index){var name=level.name||(level.attrs&&level.attrs.NAME)||(level.attributes&&level.attributes.NAME);if(name)return String(name);if(level.height)return level.height+'p';if(level.bitrate)return Math.round(level.bitrate/1000)+'kbps';return 'جودة '+(index+1);}

function satShowQualities(hls,token){var levels=hls.levels||[];if(token!==satEngineToken||levels.length<2)return;satQualitySources=levels.map(function(level,index){return {label:satQualityLabel(level,index),index:index};});var toggle=document.getElementById('satQualityToggle'),options=document.getElementById('satQualityOptions');toggle.style.display='inline-block';options.innerHTML='';satQualitySources.forEach(function(source,index){var button=document.createElement('button');button.type='button';button.textContent=source.label;button.onclick=function(){satQualityIndex=index;hls.currentLevel=source.index;options.classList.remove('open');};options.appendChild(button);});}

function satCreateHost(id){var host=document.createElement('div');host.id=id;host.dataset.playerHost='true';host.style.cssText='position:absolute;inset:0;width:100%;height:100%;background:#000;';satWrapEl.appendChild(host);return host;}

function satPlayWithEngine(url,engine,token,failed){
  satActiveEngine=engine;
  if(!satVideoEl || !satWrapEl){failed();return;}
  satVideoEl.style.display=engine==='native'||engine==='videojs'||engine==='hlsjs'?'block':'none';
  try{
    if(engine==='native'){
      satVideoEl.src=url;
      satVideoEl.onplaying=function(){if(token===satEngineToken)satFinishKidsEngine(token);};
      satVideoEl.onerror=function(){if(token===satEngineToken)failed();};
      satVideoEl.play().catch(function(){if(token===satEngineToken)failed();});
      return;
    }
    if(engine==='videojs'&&window.videojs){
      try{satActiveVideoJs=videojs(satVideoEl,{autoplay:true,controls:true,responsive:true,fluid:false});satActiveVideoJs.src({src:url,type:'application/x-mpegURL'});satActiveVideoJs.on('playing',function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveVideoJs.on('error',function(){if(token===satEngineToken)failed();});satActiveVideoJs.play().catch(function(){});return;}catch(e){if(token===satEngineToken)failed();return;}
    }
    if(engine==='hlsjs'&&window.Hls&&Hls.isSupported()){
      try{satActiveHls=new Hls();satActiveHls.loadSource(url);satActiveHls.attachMedia(satVideoEl);satActiveHls.on(Hls.Events.MANIFEST_PARSED,function(){satShowQualities(satActiveHls,token);satVideoEl.play().catch(function(){});});satActiveHls.on(Hls.Events.FRAG_LOADED,function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveHls.on(Hls.Events.ERROR,function(event,data){if(data&&data.fatal&&token===satEngineToken)failed();});return;}catch(e){if(token===satEngineToken)failed();return;}
    }
    if(engine==='shaka'&&window.shaka&&shaka.Player&&shaka.Player.isBrowserSupported()){
      try{satActiveShaka=new shaka.Player(satVideoEl);satActiveShaka.load(url).then(function(){satVideoEl.play().then(function(){if(token===satEngineToken)satFinishKidsEngine(token);}).catch(function(){if(token===satEngineToken)failed();});}).catch(function(){if(token===satEngineToken)failed();});return;}catch(e){if(token===satEngineToken)failed();return;}
    }
    if(engine==='dplayer'&&window.DPlayer){
      try{var dHost=satCreateHost('sat-dplayer-host');satActiveDplayer=new DPlayer({container:dHost,autoplay:true,video:{url:url,type:'hls'}});satActiveDplayer.on('playing',function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveDplayer.on('error',function(){if(token===satEngineToken)failed();});return;}catch(e){if(token===satEngineToken)failed();return;}
    }
    if(engine==='clappr'&&window.Clappr){
      try{var cHost=satCreateHost('sat-clappr-host');satActiveClappr=new Clappr.Player({source:url,parentId:'#'+cHost.id,autoPlay:true,mute:false});satActiveClappr.on(Clappr.Events.PLAYER_READY,function(){if(token===satEngineToken)satFinishKidsEngine(token);});satActiveClappr.on(Clappr.Events.PLAYER_ERROR,function(){if(token===satEngineToken)failed();});return;}catch(e){if(token===satEngineToken)failed();return;}
    }
  }catch(e){if(token===satEngineToken)failed();}
  if(token===satEngineToken)failed();
}

function satFinishKidsEngine(token){if(token!==satEngineToken)return;if(satEngineTimer){clearTimeout(satEngineTimer);satEngineTimer=null;}hidePlayerLoader('sat');try{satPlayerFailure.classList.remove('show');}catch(e){}}

function buildUrlVariants(url){
  var variants=[url];
  if(/^http:\/\//i.test(url)){var u=url.replace(/^http:/i,'https:');if(variants.indexOf(u)===-1)variants.push(u);}
  return variants;
}

function satPlayVideo(url,name,image,automatic){
  satResetPlayers();
  satVideoEl.muted=false;
  satVideoEl.volume=1;
  satActiveUrl=url;
  satActiveName=name||satActiveName||'';
  satActiveImage=image||satActiveImage||'';
  if(!automatic)satFallbackCycle=0;
  satSetKidsPlayerMode('primary');satHideMsg();
  showPlayerLoader('sat');
  if(satActiveName&&url){bumpViews(satFavKey(satActiveName,url));}
  var satRetryLoaderBtn=document.getElementById('satRetryLoaderBtn');
  if(satRetryLoaderBtn){satRetryLoaderBtn.onclick=function(){try{satPlayerFailure.classList.remove('show');}catch(e){}satPlayVideo(satActiveUrl,satActiveName,satActiveImage,true);};}
  var token=satEngineToken;
  var selected=document.getElementById('satEngineSelect').value;
  var baseEngines=selected==='auto'?['native','hlsjs','dplayer','clappr','videojs','shaka']:[selected,'native','hlsjs','dplayer','clappr','videojs','shaka'];
  var engines=[];
  var variants=buildUrlVariants(url);
  for(var v=0;v<variants.length;v++){for(var e=0;e<baseEngines.length;e++){engines.push({engine:baseEngines[e],url:variants[v]});}}
  var index=0;
  function next(){
    if(token!==satEngineToken)return;
    if(index>=engines.length){
      if(satFallbackCycle===0){satFallbackCycle=1;satShowMsg('⚠ تعذر التشغيل، جاري الانتقال للمشغل الاحتياطي...');setTimeout(function(){if(token===satEngineToken&&satActiveUrl===url)satPlayBackupVideo(url,satActiveName,satActiveImage);},500);}
      else{hidePlayerLoader('sat');showPlayerFailure('sat','⚠ تعذر تشغيل رابط البث بالمشغلين المتاحين.',function(){satPlayVideo(satActiveUrl,satActiveName,satActiveImage,true);});}
      return;
    }
    var item=engines[index++];
    satResetPlayersForEngine();
    satVideoEl.muted=false;
    satVideoEl.volume=1;
    satPlayWithEngine(item.url,item.engine,token,next);
    satEngineTimer=setTimeout(function(){if(token===satEngineToken)next();},6000);
  }
  next();
}

function satPlayBackupVideo(url,name,image){
  satResetPlayers();
  satVideoEl.muted=false;
  satVideoEl.volume=1;
  satActiveUrl=url;satActiveName=name||satActiveName||'';satActiveImage=image||satActiveImage||'';satSetKidsPlayerMode('backup');satHideMsg();showPlayerLoader('sat');
  var satRetryLoaderBtn2=document.getElementById('satRetryLoaderBtn');
  if(satRetryLoaderBtn2){satRetryLoaderBtn2.onclick=function(){try{satPlayerFailure.classList.remove('show');}catch(e){}satPlayBackupVideo(satActiveUrl,satActiveName,satActiveImage);};}
  var variants=buildUrlVariants(url);
  var vIndex=0;
  function tryNext(){
    var u=variants[vIndex];
    if(!u){hidePlayerLoader('sat');showPlayerFailure('sat','⚠ المشغل الاحتياطي غير مدعوم في هذا المتصفح.',function(){satPlayBackupVideo(satActiveUrl,satActiveName,satActiveImage);});return;}
    if(!window.shaka||!shaka.Player.isBrowserSupported()){hidePlayerLoader('sat');showPlayerFailure('sat','⚠ المشغل الاحتياطي غير مدعوم في هذا المتصفح.',function(){satPlayVideo(satActiveUrl,satActiveName,satActiveImage,true);});return;}
    try{satActiveShaka=new shaka.Player(satVideoEl);satActiveShaka.load(u).then(function(){hidePlayerLoader('sat');try{satPlayerFailure.classList.remove('show');}catch(e){}satVideoEl.play().catch(function(){});}).catch(function(){vIndex++;if(vIndex<variants.length){satActiveShaka=null;tryNext();}else{hidePlayerLoader('sat');showPlayerFailure('sat','⚠ فشل المشغل الاحتياطي، جاري الرجوع للمشغل الرئيسي...',function(){satPlayVideo(satActiveUrl,satActiveName,satActiveImage,true);});setTimeout(function(){if(satActiveUrl===url&&satKidsPlayerMode==='backup')satPlayVideo(satActiveUrl,satActiveName,satActiveImage,true);},1200);}});}catch(e){vIndex++;if(vIndex<variants.length)tryNext();else{hidePlayerLoader('sat');showPlayerFailure('sat','⚠ تعذر تشغيل المشغل الاحتياطي.',function(){satPlayVideo(satActiveUrl,satActiveName,satActiveImage,true);});}}
  }
  tryNext();
}

function satResetPlayersForEngine(){
  if(satEngineTimer){clearTimeout(satEngineTimer);satEngineTimer=null;}
  try{if(satActiveHls)satActiveHls.destroy();}catch(e){}
  try{if(satActiveShaka)satActiveShaka.destroy();}catch(e){}
  try{if(satActiveVideoJs)satActiveVideoJs.dispose();}catch(e){}
  try{if(satActiveDplayer)satActiveDplayer.destroy();}catch(e){}
  try{if(satActiveClappr)satActiveClappr.destroy();}catch(e){}
  satActiveHls=null;satActiveShaka=null;satActiveVideoJs=null;satActiveDplayer=null;satActiveClappr=null;
  satWrapEl.querySelectorAll('[data-player-host]').forEach(function(host){host.remove();});
  satEnsureKidsVideo();

function satEnsureKidsVideo(){
  if(satWrapEl.contains(satVideoEl))return;
  satVideoEl=document.createElement('video');satVideoEl.id='satVideoEl';satVideoEl.controls=true;satVideoEl.autoplay=true;satVideoEl.playsInline=true;
  satWrapEl.insertBefore(satVideoEl,satWrapEl.firstChild);
}

/* ===== تحميل مكتبات المشغلين عند الحاجة ===== */
var satLibsLoaded=false;
function loadScriptOnce(src,test){
  return new Promise(function(resolve){
    if(test()){resolve();return;}
    var s=document.createElement('script');s.src=src;s.async=false;s.onload=function(){resolve();};s.onerror=function(){resolve();};
    document.head.appendChild(s);
  });
}
function loadSatLibraries(){
  if(satLibsLoaded){return Promise.resolve();}
  var chain=Promise.resolve();
  chain=chain.then(function(){return loadScriptOnce('https://cdn.jsdelivr.net/npm/hls.js@1',function(){return !!window.Hls;});});
  chain=chain.then(function(){return loadScriptOnce('https://cdn.jsdelivr.net/npm/dashjs@4/dist/dash.all.min.js',function(){return !!window.dashjs;});});
  chain=chain.then(function(){return loadScriptOnce('https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js',function(){return !!window.shaka;});});
  chain=chain.then(function(){return loadScriptOnce('https://cdn.jsdelivr.net/npm/flv.js@1/dist/flv.min.js',function(){return !!window.flvjs;});});
  chain=chain.then(function(){return loadScriptOnce('https://vjs.zencdn.net/8.10.0/video.min.js',function(){return !!window.videojs;});});
  chain=chain.then(function(){return loadScriptOnce('https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js',function(){return !!window.DPlayer;});});
  chain=chain.then(function(){return loadScriptOnce('https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js',function(){return !!window.Clappr;});});
  return chain.then(function(){satLibsLoaded=true;});
}
